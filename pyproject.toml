[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "council-multi-agent"
version = "0.1.0"
description = "A multi-agent decision council in which abstention is a first-class outcome"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mauricio Gerardo Trevino Saldana" }]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
